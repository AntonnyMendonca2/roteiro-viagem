<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e0e">
  <title>Mapa da Viagem — Europa 2027</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e0e0e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23F5B841'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Mapa (D3 desenha dentro deste SVG) ===== -->
  <svg id="map" role="img" aria-label="Mapa interativo da Europa com o roteiro da viagem">
    <defs>
      <!-- hachura das áreas somente informativas (Ucrânia, Rússia, Bielorrússia) -->
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="7" stroke="#9a9a9a" stroke-width="1.3" opacity="0.5"/>
      </pattern>
    </defs>
  </svg>
  <div id="loading">Carregando o mapa…</div>

  <!-- ===== Barra superior: título, filtro por tag, voltar ao zoom inicial ===== -->
  <header id="topbar">
    <div class="brand">
      <strong>Europa 2027</strong>
      <span>planejador de viagem</span>
    </div>
    <div id="tags" class="chips" role="group" aria-label="Filtrar pontos por tag"></div>
    <div class="top-btns">
      <div class="cen-wrap">
        <button id="btn-cen" class="btn pill" type="button" data-act="cen-menu" aria-haspopup="true" aria-expanded="false" title="Cenários: versões diferentes do roteiro">Cenário</button>
        <div id="cenmenu" hidden></div>
      </div>
      <button id="btn-share" class="btn pill" type="button" data-act="share" title="Compartilhar o roteiro por link" aria-label="Compartilhar o roteiro">
        <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Compartilhar</span>
      </button>
      <button id="btn-rota" class="btn pill" type="button" data-act="fit-route" title="Enquadrar as cidades do roteiro">Ver meu roteiro</button>
      <button id="btn-home" class="btn pill" type="button" title="Mostrar todos os destinos (Esc)">Ver Europa inteira</button>
    </div>
  </header>

  <!-- chips do dia a dia (aparecem com uma cidade aberta) -->
  <div id="daychips" class="chips" role="group" aria-label="Dias da cidade aberta"></div>

  <!-- ===== Painel lateral (gaveta inferior no celular) ===== -->
  <aside id="sidebar" aria-label="Planejamento">
    <header id="summary">
      <button class="drawer-handle" type="button" data-act="drawer" aria-label="Abrir ou fechar o painel"><i></i></button>
      <div class="sum-top">
        <div>
          <span class="sum-label">Total da viagem</span>
          <strong id="sum-total">R$ 0</strong>
        </div>
        <div class="sum-right">
          <span id="sum-pct">0%</span>
          <span class="sum-of">de <span id="sum-budget">R$ 0</span></span>
        </div>
      </div>
      <div class="progress" aria-hidden="true"><div id="sum-bar"></div></div>
      <button class="sum-toggle" type="button" data-act="sum-toggle" aria-expanded="false">Subtotais por cidade e categoria <span>▾</span></button>
      <div id="sum-details" hidden></div>
    </header>

    <div class="sb-main">
      <div class="sb-scroll">
        <nav class="tabs" role="tablist">
          <button type="button" role="tab" data-act="tab" data-tab="roteiro">Meu roteiro</button>
          <button type="button" role="tab" data-act="tab" data-tab="orcamento">Orçamento</button>
          <button type="button" role="tab" data-act="tab" data-tab="assistente">Assistente</button>
          <button type="button" role="tab" data-act="tab" data-tab="dados">Dados</button>
        </nav>
        <div id="views"></div>
        <section id="compare" aria-label="Comparativo trem × avião"></section>
      </div>
      <!-- detalhes da cidade / ponto (desliza por cima das abas) -->
      <div id="detail" aria-live="polite"></div>
    </div>
  </aside>

  <!-- ===== Linha do tempo e legenda ===== -->
  <div id="timeline" aria-label="Linha do tempo da viagem"></div>
  <div id="legend"></div>
  <div id="mapinfo">
    <div id="scale" aria-label="Escala do mapa"><i></i><span></span></div>
    <div id="attrib">Mapa © <a href="https://www.esri.com" target="_blank" rel="noopener noreferrer">Esri</a>, HERE, Garmin, © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a></div>
  </div>

  <!-- ===== Elementos flutuantes ===== -->
  <div id="hovercard" aria-hidden="true"></div>
  <div id="tip" aria-hidden="true"></div>
  <div id="flightcard" role="dialog" aria-label="Passagens aéreas"></div>
  <div id="cenbox" role="dialog" aria-label="Comparação de cenários"></div>
  <div id="sharebox" role="dialog" aria-label="Compartilhar o roteiro"></div>
  <div id="sharebar" role="region" aria-label="Roteiro compartilhado"></div>
  <div id="toast" role="status"></div>
  <input type="file" id="file-import" accept="application/json,.json" hidden>

  <!-- Bibliotecas (CDN, versões fixas) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

  <!-- App (scripts comuns, sem módulos: funciona em file:// e no GitHub Pages) -->
  <script src="js/data.js"></script>
  <script src="js/data-europa.js"></script>
  <script src="js/data-pontos-1.js"></script>
  <script src="js/data-pontos-2.js"></script>
  <script src="js/net.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cambio.js"></script>
  <script src="js/clima.js"></script>
  <script src="js/wiki.js"></script>
  <script src="js/trilhos.js"></script>
  <script src="js/ape.js"></script>
  <script src="js/descobrir.js"></script>
  <script src="js/diaadia.js"></script>
  <script src="js/assistente.js"></script>
  <script src="js/cenarios.js"></script>
  <script src="js/compartilhar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
